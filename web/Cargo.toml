[package]
edition      = "2021"
name         = "serenity-web"
version      = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
ui = { path = "../ui" }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"

# wasm-pack otherwise downloads a pinned binaryen release at build time, which
# fails in offline/sandboxed environments. Install binaryen and drop this if
# you want the extra size win.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false