# Workspace-wide settings only. The ESP32 target, its runner, the backtrace
# rustflags and `build-std` live in firmware/.cargo/config.toml so they do not
# leak into the ui/web crates.

[env]
DEFMT_LOG = "info"

[alias]
# Firmware must be built from its own directory so Cargo picks up
# firmware/.cargo/config.toml (target + build-std are not workspace-wide).
esp = "build --manifest-path firmware/Cargo.toml --target riscv32imac-unknown-none-elf"
web = "build --manifest-path web/Cargo.toml --target wasm32-unknown-unknown"