[package]
edition      = "2021"
name         = "display-co5300-test"
# rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "display-co5300-test"
path = "./src/bin/main.rs"

[dependencies]

slint = { version = "1.18.1", default-features = false, features = ["renderer-software", "libm", "unsafe-single-threaded", "compat-1-2"] }

esp-hal = { version = "1.1.1", features = ["defmt", "esp32c6", "unstable", "rt"] }

esp-rtos = { version = "0.3.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp32c6",
] }

defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32c6"] }

embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }

esp-backtrace = { version = "0.19.0", features = [
  "defmt",
  "esp32c6",
  "panic-handler",
] }
esp-println = { version = "0.17.0", features = ["defmt-espflash", "esp32c6"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
display-driver = "0.1.0"
display-driver-qspi = "0.1.0"
display-driver-co5300 = "0.1.1"
embedded-hal = "1.0.0"
embedded-graphics = "0.8.2"

embedded-hal-async = "1.0.0"
embedded-hal-bus = "0.3.0"

embedded-alloc = { version = "0.5" }
bytemuck = { version = "1.15.0", features = ["derive"] }
embassy-futures = "0.1.2"


[build-dependencies]
slint-build = "1.18.1"

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = "z"
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "z"
overflow-checks = false
