[package]
edition      = "2021"
name         = "firmware"
# rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "display-co5300-test"
path = "./src/main.rs"

[dependencies]

# Slint itself is re-exported by the UI crate so the two hosts cannot end up on
# different renderers. `ui::slint` is the only way the firmware touches Slint.
ui = { path = "../ui" }

esp-hal = { version = "1.1.1", features = ["defmt", "esp32c6", "unstable", "rt"] }

esp-rtos = { version = "0.3.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp32c6",
] }

defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32c6"] }

# no_std (alloc-only) error propagation for the boot path.
anyhow = { version = "1.0", default-features = false }

embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }

esp-backtrace = { version = "0.19.0", features = [
  "defmt",
  "esp32c6",
  "panic-handler",
] }
esp-println = { version = "0.17.0", features = ["defmt-espflash", "esp32c6"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
display-driver = "0.1.0"
display-driver-qspi = "0.1.0"
display-driver-co5300 = "0.1.1"
embedded-hal = "1.0.0"
embedded-graphics = "0.8.2"

embedded-hal-async = "1.0.0"
embedded-hal-bus = "0.3.0"

# CST9220 capacitive touch controller. The shared I2C bus is driven through
# embedded-hal-bus' RefCellDevice, which only implements the blocking I2C trait,
# so the blocking driver is used instead of the default async one.
cst92xx = { version = "0.2.4", default-features = false, features = [
  "blocking",
  "defmt",
] }

embedded-alloc = { version = "0.5" }
bytemuck = { version = "1.15.0", features = ["derive"] }
embassy-futures = "0.1.2"